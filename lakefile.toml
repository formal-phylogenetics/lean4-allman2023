name = "Allman2023"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of Allman, Baños, Mitchell, Rhodes 2023, The tree of blobs of a species network: identifiability under the coalescent"
defaultTargets = ["Allman2023", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "3fcabfd7d191990dda268b0b3968d945b65eb59a"

# The hub above this paper's: what the papers on network estimation share.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/vltanh/lean4-phylo-network"
rev = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"

# The hub of the tree-of-blobs papers: what only they share.
[[require]]
name = "TreeOfBlobs"
git = "https://github.com/vltanh/lean4-tob"
rev = "31465cd5dd0b4c173b8bcb49bb5f5dfeb8c99241"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of the project is in Allman2023/, but its Challenge and its Solution, which are in
# palomar/ (lean4-phylogenetics, docs/CONVENTIONS.md, Sections 2 and 3). Lake fails on a glob whose
# directory, or a root whose file, does not exist.

# The paper's library, in the namespace Allman2023: general mathematics in Allman2023/Basic/, the
# results the paper cites in Allman2023/External/, the definitions of the Challenge in
# Allman2023/Defs.lean, and the paper's sections.
[[lean_lib]]
name = "Allman2023"
globs = ["Allman2023.+"]

# The paper's Challenge and Solution, the modules Allman2023.Challenge and Allman2023.Solution of
# the source directory palomar/ (Comparator: palomar/Allman2023/comparator.json). Declared last:
# Lake gives a module to the last library whose patterns match it, and the glob above matches
# these names when the paper's name is the root.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
roots = ["Allman2023.Challenge", "Allman2023.Solution"]
