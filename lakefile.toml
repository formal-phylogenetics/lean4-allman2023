name = "AllmanEtAl2023"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of Allman, Baños, Mitchell, Rhodes 2023"
defaultTargets = ["AllmanEtAl2023"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "4daee158d74436ce6ed6f52e337ba00f1b43ea32"

# The hub of the tree-of-blobs papers: what they share.
[[require]]
name = "TreeOfBlobs"
git = "https://github.com/vltanh/lean4-tob"
rev = "b2dadbda0c992091dd6e9105e1394c5b7557602c"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of this repository is under AllmanEtAl2023/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "AllmanEtAl2023"
globs = ["AllmanEtAl2023.+"]
